version: '3.8'
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile-dev
    ports:
      - '5173:5173' # Default Vite port
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_VUE_APP_BACKEND_URL=http://localhost:5001

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '5001:5001'
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm start